#----------------history load----------------
from pyspark.sql import SparkSession
from pyspark.sql.functions import lit,current_date,current_timestamp,expr,to_timestamp,col,coalesce,concat,lit,to_date
spark=SparkSession.builder.appName('Scd Type 2').getOrCreate()
source_df=spark.read.format('csv').option('inferShema','true').option('header','true').load('/FileStore/tables/source_df-1.txt')
#added new columns to make it target
target_df=source_df.withColumn('active_status',lit('Y')).withColumn('start_date', to_timestamp(lit('2025-04-01T00:00'))).withColumn('end_date',to_timestamp(lit('9999-12-31T23:59:59')))
#converted to delta table
target_df.write.format("delta").mode("overwrite").save("/FileStore/tables/target_fix")

#--------------incremental_load---------------
source_dfm=spark.read.format('csv').option('inferShema','true').option('header','true').load('/FileStore/tables/source_df-2.txt')
#source_dfm left joined with target_df
target1 = source_dfm.join(target_df, 
                              (source_dfm["pk1"] == target_df["pk1"]) & 
                              (source_dfm["pk2"] == target_df["pk2"]), 
                              'left').select(source_dfm["*"],
                                             target_df["pk1"].alias('tpk1'),
                                             target_df["pk2"].alias('tpk2'),
                                             target_df["dim1"].alias('tdim1'),
                                             target_df["dim2"].alias('tdim2'),
                                             target_df["dim3"].alias('tdim3'),
                                             target_df["dim4"].alias('tdim4')).orderBy(col('pk1'))
#filtering changed data and new data
target2 = target1.filter(
    (coalesce(col('dim1'), lit('0')) != coalesce(col('tdim1'), lit('0'))) |
    (coalesce(col('dim2'), lit('0')) != coalesce(col('tdim2'), lit('0')))
)
#creating merge key for above one 
target3 = target2.withColumn('merge_key', concat(col('pk1'), col('pk2')))
target3 = target3.orderBy(col('pk1').asc())
#creating merge key for matching primary keys
target4=target3.filter((col('pk1')==col('tpk1')) & (col('pk2')==col('tpk2')))
t=target4.drop(col('merge_key'))
target4=t.withColumn('merge_key',lit('null'))
#union above two dataframes
sourcedf=target3.unionAll(target4)
#(merge_statement) if their is a match it will update, no math it will insert
from delta.tables import DeltaTable
from pyspark.sql.functions import col, lit, current_date, to_date, concat
delta_target = DeltaTable.forPath(spark, "/FileStore/tables/target_fix")
delta_target.alias("target").merge(
    source=sourcedf.alias("source"),
    condition=(
        concat(col("target.pk1"), col("target.pk2")) == col("source.merge_key")
    )
).whenMatchedUpdate(
    set={
        "active_status": lit("N"),
        "end_date": current_date()
    }
).whenNotMatchedInsert(
    values={
        "pk1": col("source.pk1"),
        "pk2": col("source.pk2"),
        "dim1": col("source.dim1"),
        "dim2": col("source.dim2"),
        "dim3": col("source.dim3"),
        "dim4": col("source.dim4"),
        "active_status": lit("Y"),
        "start_date": current_date(),
        "end_date": to_date(lit("9999-12-31"), "yyyy-MM-dd")
    }
).execute()
df=spark.read.format('delta').load('/FileStore/tables/target_fix')
df.orderBy(col('pk1')).display()
